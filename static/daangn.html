<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>당근 소식 관리 | 생각키움연구소</title><style>body{font-family:system-ui,sans-serif;background:#f7f8fc;color:#202538;margin:0}main{max-width:680px;margin:auto;padding:18px}section{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 2px 10px #1111}label{display:block;margin:12px 0 5px;font-weight:650}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd1dc;border-radius:9px}textarea{min-height:150px}button{background:#334a86;color:white;border:0;margin:7px 0;cursor:pointer}button.secondary{background:#e8ecf5;color:#27355c}small{color:#697386}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.entry{border-top:1px solid #eee;padding:12px 0}a{color:#3453a2}</style></head><body><main><h2>♟ 생각키움 당근 소식 관리</h2><p>기존 SNS 매니저의 당근 전용 게시 준비 화면입니다. 실제 게시 완료는 당근에서 직접 진행합니다.</p><section><h3>게시 일정 만들기</h3><label>주간 횟수</label><select id="freq"><option value="1">주 1회</option><option value="2" selected>주 2회</option></select><button onclick="schedule()">향후 4주 일정 생성</button><div id="schedule"></div></section><section><h3>소식 원고 검수</h3><label>지점</label><select id="branch"><option>구래점</option><option>사우점</option><option>장기점</option></select><label>게시 유형</label><select id="type"><option>소식</option><option>공지</option><option>이벤트</option></select><label>홍보 주제</label><select id="topic"><option>사고력 체스 수업</option><option>영어·중국어 체스</option><option>체스클럽</option><option>체스대회</option><option>학생 수상 소식</option><option>등록 이벤트</option></select><label>실제 수업·행사 정보 (AI 작성 근거)</label><textarea id="facts" placeholder="실제 있었던 일, 일정, 참가 대상, 신청 방법 등을 적어 주세요."></textarea><button onclick="aiDraft()">AI로 당근 원고 작성</button><button class="secondary" onclick="draft()">AI 없이 예시 문구 만들기</button><div id="missing" role="status"></div><label>제목</label><input id="title" placeholder="제목을 검수하세요"><label>본문 (최소 4자)</label><textarea id="body" placeholder="사실관계와 일정·혜택을 직접 확인하세요"></textarea><label>사진 첨부 확인</label><input type="file" id="photos" accept="image/*" multiple><small>사진은 최대 10장까지 선택할 수 있으며, 당근에 다시 첨부해야 합니다.</small><div class="actions"><button onclick="copy('title')">제목 복사</button><button onclick="copy('body')">본문 복사</button></div><button onclick="save()">검수 완료 · 게시 대기 저장</button><button class="secondary" onclick="window.open('https://business.daangn.com/','_blank')">당근 비즈니스 열기</button></section><section><h3>게시 이력</h3><div id="history"></div><button class="secondary" onclick="backup()">기록 백업(JSON)</button><small>저장 기록은 이 브라우저에만 남습니다. 휴대폰을 바꾸기 전에 백업하세요.</small></section><p><a href="/">SNS 매니저 메인으로</a></p></main><script>
const key='saenggak-daangn-records-v1';const el=id=>document.getElementById(id);let records=JSON.parse(localStorage.getItem(key)||'[]');function persist(){localStorage.setItem(key,JSON.stringify(records));render()}
async function aiDraft(){let btn=event.currentTarget;btn.disabled=true;btn.textContent='원고 작성 중...';try{let f=new FormData();f.append('branch',el('branch').value);f.append('post_type',el('type').value);f.append('topic',el('topic').value);f.append('facts',el('facts').value);let res=await fetch('/api/daangn-draft',{method:'POST',body:f});let data=await res.json();if(!res.ok)throw new Error(typeof data.detail==='string'?data.detail:'원고 생성에 실패했습니다.');el('title').value=data.title;el('body').value=data.body;el('missing').textContent=(data.missing_info||[]).length?'게시 전 확인: '+data.missing_info.join(', '):'게시 전 사실관계를 확인하세요.'}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='AI로 당근 원고 작성'}}
function draft(){let b=el('branch').value,t=el('topic').value;el('title').value='김포 '+b+' | '+t+' 안내';el('body').value='생각키움연구소 '+b+'에서는 '+t+'을(를) 통해 아이들이 관찰하고 비교하며 스스로 선택하는 과정을 배웁니다. 자세한 수업 내용은 학원으로 문의해 주세요.\n\n※ 실제 일정·대상·혜택은 게시 전에 확인해 주세요.'}
async function copy(id){let v=el(id).value;if(!v.trim())return alert('복사할 내용이 없습니다.');try{await navigator.clipboard.writeText(v);alert('복사했습니다.')}catch(e){el(id).select();document.execCommand('copy');alert('복사했습니다.')}}
function save(){let t=el('title').value.trim(),b=el('body').value.trim(),p=el('photos').files;if(!t||b.length<4)return alert('제목과 4자 이상 본문을 입력하세요.');if(p.length>10)return alert('사진은 최대 10장입니다.');records.unshift({id:Date.now(),branch:el('branch').value,type:el('type').value,title:t,body:b,photos:p.length,date:new Date().toLocaleDateString('ko-KR'),status:'대기'});persist();alert('게시 대기 목록에 저장했습니다.')}
function mark(id){let r=records.find(x=>x.id===id);if(r){r.status='게시 완료';persist()}}
function render(){el('history').innerHTML='';records.forEach(r=>{let d=document.createElement('div');d.className='entry';let h=document.createElement('div');h.textContent=r.date+' · '+r.branch+' · '+r.type+' · '+r.status;let p=document.createElement('p');p.textContent=r.title;d.append(h,p);if(r.status!=='게시 완료'){let btn=document.createElement('button');btn.textContent='당근 게시 후 완료 표시';btn.onclick=()=>mark(r.id);d.append(btn)}el('history').append(d)});if(!records.length)el('history').textContent='저장된 글이 없습니다.'}
function schedule(){let n=Number(el('freq').value),start=new Date(),dates=[];for(let w=0;w<4;w++)for(let j=0;j<n;j++){let d=new Date(start);d.setDate(d.getDate()+w*7+j*3);dates.push(d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'}))}el('schedule').textContent=dates.join(' · ')+' (예시 일정: 실제 알림은 전송되지 않습니다)'}
function backup(){let blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daangn-records.json';a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
